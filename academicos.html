<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONELIFE — Archivos Académicos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src='https://cdn.jsdelivr.net/npm/lenis@1.3.13/dist/lenis.min.js'></script>

  <style>
    :root {
      --bg: #0A0A0A;
      --bg-darker: #050505;
      --surface: #111111;
      --fg: #F5F5F5;
      --fg-dim: #A0A0A0;
      --muted: #555555;
      --accent: #C6FF00;
      --border: rgba(255, 255, 255, 0.08);
      --serif: 'Instrument Serif', serif;
      --sans: 'Inter', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: auto; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
      font-weight: 300;
      line-height: 1.6;
      overflow-x: hidden;
      /* cursor: none; */ /* Eliminado para usar el cursor del sistema */
      -webkit-font-smoothing: antialiased;
    }

    @media (pointer: coarse) { body { cursor: auto; } }

    ::selection { background: var(--accent); color: var(--bg); }
    a { color: inherit; text-decoration: none; }

    /* Custom Cursor - Desactivado */
    /*
    .cursor-outline {
      position: fixed; top: 0; left: 0; width: 24px; height: 24px;
      border: 1px solid var(--fg); border-radius: 50%;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%, -50%); mix-blend-mode: difference;
      transition: width 0.2s, height 0.2s, border-color 0.2s, opacity 0.3s;
      opacity: 0;
    }
    .cursor-hover .cursor-outline { width: 40px; height: 40px; border-color: var(--accent); }
    */

    /* Grain Overlay */
    .grain {
      position: fixed; inset: 0; pointer-events: none; z-index: 9000;
      opacity: 0.06; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='250' height='250'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    /* Header */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 1.5rem 2rem;
      display: flex; justify-content: space-between; align-items: center;
      backdrop-filter: blur(10px); background: rgba(10, 10, 10, 0.6);
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-family: var(--serif); font-size: 1.8rem; letter-spacing: -0.02em;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .logo i { color: var(--accent); font-size: 1.2rem; }
    
    .nav-links {
      display: flex; gap: 2rem; font-family: var(--mono);
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em;
    }
    .nav-links a { position: relative; color: var(--fg-dim); transition: color 0.3s; }
    .nav-links a:hover { color: var(--fg); }
    .nav-links a::after {
      content: ''; position: absolute; bottom: -4px; left: 0;
      width: 0; height: 1px; background: var(--accent); transition: width 0.3s;
    }
    .nav-links a:hover::after { width: 100%; }

    .auth-area { display: flex; align-items: center; gap: 1rem; opacity: 0; transition: opacity 0.3s; }
    .auth-area.ready { opacity: 1; }
    
    #loginBtn {
      background: transparent; border: 1px solid var(--fg); color: var(--bg);
      background: var(--fg); padding: 0.6rem 1.2rem;
      font-family: var(--mono); font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 0.1em; cursor: pointer; transition: all 0.3s;
      display: flex; align-items: center; gap: 0.5rem;
    }
    #loginBtn:hover { background: var(--accent); border-color: var(--accent); color: var(--bg); }

    #userAvatar {
      width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--accent);
      cursor: pointer; display: none; object-fit: cover; transition: transform 0.3s;
    }
    #userAvatar:hover { transform: scale(1.1); }

    /* Main Content */
    .main-content {
      position: relative; z-index: 2;
      max-width: 1280px; margin: 0 auto;
      padding: 12rem 2rem 6rem;
    }

    .bg-text {
      position: absolute; top: 8rem; right: -2rem;
      font-family: var(--serif); font-style: italic;
      font-size: clamp(10rem, 30vw, 30rem);
      color: rgba(255,255,255,0.015); pointer-events: none; z-index: 0;
      letter-spacing: -0.04em; white-space: nowrap;
    }

    .section-header {
      display: grid; grid-template-columns: 1fr 2fr; gap: 4rem;
      margin-bottom: 4rem; border-bottom: 1px solid var(--border); padding-bottom: 2rem;
      position: relative; z-index: 1;
    }
    .section-num { font-family: var(--mono); font-size: 0.75rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.2em; }
    .section-title { font-family: var(--serif); font-size: clamp(2.5rem, 6vw, 5rem); line-height: 1; letter-spacing: -0.02em; }
    .section-title em { font-style: italic; color: var(--muted); }

    /* Search Box */
    .search-container { margin-bottom: 3rem; position: relative; z-index: 1; }
    .search-box { display: flex; gap: 1rem; max-width: 600px; }
    .search-box input {
      flex: 1; background: transparent; border: none; border-bottom: 1px solid var(--border);
      color: var(--fg); font-family: var(--mono); font-size: 0.9rem; padding: 0.8rem 0;
      outline: none; transition: border-color 0.3s;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box input::placeholder { color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.75rem; }
    .search-box button {
      background: var(--fg); color: var(--bg); border: none; padding: 0.6rem 1.5rem;
      font-family: var(--mono); font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 0.1em; cursor: pointer; transition: all 0.3s;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .search-box button:hover { background: var(--accent); }

    /* Grids */
    .subjects-grid, .folders-grid, .files-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem; position: relative; z-index: 1;
    }

    /* Cards */
    .subject-card, .folder-card, .file-card {
      background: var(--surface); border: 1px solid var(--border);
      padding: 1.5rem; transition: all 0.3s cubic-bezier(.22,1,.36,1);
      cursor: pointer; display: flex; flex-direction: column; gap: 1rem;
      text-decoration: none; color: var(--fg);
    }
    
    .subject-card:hover, .folder-card:hover, .file-card:hover {
      border-color: var(--accent); background: rgba(198, 255, 0, 0.02);
      transform: translateY(-5px);
    }

    .card-head { display: flex; justify-content: space-between; align-items: flex-start; }
    .card-icon {
      width: 48px; height: 48px; border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); font-size: 1.1rem; border-radius: 8px;
      transition: background 0.3s;
    }
    .card:hover .card-icon { background: rgba(198, 255, 0, 0.05); }
    .card-tag {
      font-family: var(--mono); font-size: 0.65rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.1em;
      border: 1px solid var(--border); padding: 0.2rem 0.5rem; border-radius: 50px;
    }

    .card-title { font-family: var(--serif); font-size: 1.8rem; line-height: 1; }
    .card-desc { font-size: 0.85rem; color: var(--fg-dim); flex: 1; }

    .card-footer {
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid var(--border); padding-top: 1rem;
      font-family: var(--mono); font-size: 0.7rem; text-transform: uppercase; color: var(--fg-dim);
    }
    .card-footer i { color: var(--accent); transition: transform 0.3s; }
    .card:hover .card-footer i { transform: translate(3px, -3px); }

    /* Files specific */
    .file-card { border-left: 3px solid var(--accent); }
    .view-btn {
      background: transparent; border: 1px solid var(--border); color: var(--fg);
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.3s;
    }
    .view-btn:hover { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .view-btn.disabled { opacity: 0.3; cursor: not-allowed; }

    /* Navigation Buttons */
    .files-container { animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .files-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 3rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border);
    }
    .files-title { font-family: var(--serif); font-size: 2rem; flex: 1; }
    .nav-btn {
      background: transparent; border: 1px solid var(--border); color: var(--fg);
      padding: 0.6rem 1.2rem; font-family: var(--mono); font-size: 0.75rem;
      text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer;
      transition: all 0.3s; display: flex; align-items: center; gap: 0.5rem; border-radius: 8px;
    }
    .nav-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Footer */
    footer {
      padding: 4rem 2rem; border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      font-family: var(--mono); font-size: 0.75rem; text-transform: uppercase; color: var(--muted);
      position: relative; z-index: 2;
    }

    /* PDF Viewer */
    .pdf-viewer-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg); z-index: 9999; display: none; flex-direction: column;
    }
    .pdf-header {
      padding: 1.5rem 2rem; display: flex; align-items: center; gap: 2rem;
      border-bottom: 1px solid var(--border); background: var(--bg-darker);
    }
    .pdf-back-btn {
      background: transparent; border: 1px solid var(--border); color: var(--fg);
      padding: 0.6rem 1rem; font-family: var(--mono); font-size: 0.75rem;
      text-transform: uppercase; cursor: pointer; transition: all 0.3s;
      display: flex; align-items: center; gap: 0.5rem; border-radius: 8px;
    }
    .pdf-back-btn:hover { border-color: var(--accent); color: var(--accent); }
    .pdf-title {
      font-family: var(--serif); font-size: 1.5rem; flex: 1; text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pdf-frame-container { flex: 1; position: relative; background: #fff; }
    .pdf-viewer { width: 100%; height: 100%; border: none; }

    /* Modern Sidebar Profile */
    #overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 998;
      opacity: 0; pointer-events: none; transition: opacity 0.3s; backdrop-filter: blur(4px);
    }
    #overlay.open { opacity: 1; pointer-events: all; }

    #sidebar {
      position: fixed; top: 20px; right: 20px; width: 340px; 
      max-height: calc(100vh - 40px); background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; z-index: 999;
      transform: translateX(calc(100% + 40px)); transition: transform 0.4s cubic-bezier(.22,1,.36,1);
      display: flex; flex-direction: column; box-shadow: 0 30px 60px rgba(0,0,0,0.5); overflow: hidden;
    }
    #sidebar.open { transform: translateX(0); }

    .sb-header { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 1.5rem 1rem; }
    .sb-title { font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.75rem; color: var(--accent); }
    .sb-close {
      background: rgba(255,255,255,0.05); border: none; color: var(--fg-dim); 
      width: 32px; height: 32px; border-radius: 50%; cursor: pointer; transition: all 0.3s;
      display: flex; align-items: center; justify-content: center;
    }
    .sb-close:hover { background: var(--accent); color: var(--bg); }

    .sb-body { flex: 1; overflow-y: auto; padding: 1rem 1.5rem 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; }

    .profile-block {
      display: flex; flex-direction: column; align-items: center; gap: 0.5rem; 
      padding: 1rem 1rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .avatar-wrapper { position: relative; width: 80px; height: 80px; margin-bottom: 0.5rem; }
    #sidebarAvatar {
      width: 80px; height: 80px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.1); 
      object-fit: cover; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    #editAvatarBtn {
      position: absolute; bottom: 0; right: 0; width: 28px; height: 28px; border-radius: 50%;
      background: var(--fg); color: var(--bg); border: 3px solid var(--surface);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 0.6rem; transition: transform 0.2s;
    }
    #editAvatarBtn:hover { transform: scale(1.1); background: var(--accent); }

    .profile-name { font-family: var(--serif); font-size: 1.8rem; line-height: 1; }
    .profile-email { font-family: var(--mono); font-size: 0.7rem; color: var(--fg-dim); }

    #avatarBar {
      display: none; flex-direction: column; gap: 0.5rem; width: 100%; margin-top: 1.5rem;
      animation: slideDown 0.3s ease;
    }
    #avatarBar.visible { display: flex; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    
    #avatarUrlInput {
      background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
      padding: 0.7rem 1rem; color: var(--fg); font-family: var(--mono);
      font-size: 0.75rem; outline: none; border-radius: 8px;
    }
    #avatarUrlInput:focus { border-color: var(--accent); }
    .avatar-actions { display: flex; gap: 0.5rem; }
    .btn-av {
      flex: 1; padding: 0.6rem; border: none; cursor: pointer; font-family: var(--mono);
      font-size: 0.7rem; text-transform: uppercase; border-radius: 8px;
    }
    #applyAvatarBtn { background: var(--accent); color: var(--bg); }
    #cancelAvatarBtn { background: rgba(255,255,255,0.05); color: var(--fg-dim); }

    .info-card {
      background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); 
      padding: 1rem; border-radius: 12px;
    }
    .info-title { font-family: var(--mono); font-size: 0.65rem; color: var(--muted); text-transform: uppercase; margin-bottom: 0.75rem; letter-spacing: 0.1em; }
    .info-row { display: flex; align-items: center; gap: 0.8rem; font-size: 0.8rem; padding: 0.3rem 0; color: var(--fg-dim); }
    .info-row i { color: var(--accent); width: 16px; text-align: center; }

    .sb-footer { padding: 1rem 1.5rem 1.5rem; }
    #logoutBtn {
      width: 100%; padding: 0.8rem; background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--fg-dim);
      font-family: var(--mono); text-transform: uppercase; font-size: 0.7rem; cursor: pointer; transition: all 0.3s; border-radius: 12px;
    }
    #logoutBtn:hover { border-color: #ff4d4d; color: #ff4d4d; background: rgba(255,77,77,0.05); }

    /* Toast */
    #toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--surface); border: 1px solid var(--accent); color: var(--fg); padding: 0.8rem 1.5rem;
      font-family: var(--mono); font-size: 0.8rem; z-index: 3000; opacity: 0; pointer-events: none;
      transition: all 0.3s; border-radius: 50px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.error { border-color: #ff4d4d; color: #ff4d4d; }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .section-header { grid-template-columns: 1fr; gap: 1rem; }
      .main-content { padding: 9rem 1.5rem 4rem; }
      .files-header { flex-direction: column; align-items: flex-start; gap: 1rem; }
      #sidebar { width: calc(100% - 40px); }
    }
  </style>
</head>
<body>

  <div class="grain"></div>
  <!-- <div class="cursor-outline"></div> --> <!-- Desactivado -->

  <!-- HEADER -->
  <header>
    <a href="https://trabalonp.github.io" class="logo">ONELIFE <i class="fas fa-bolt"></i></a>
    <nav class="nav-links">
      <a href="https://trabalonp.github.io">Inicio</a>
      <a href="../enlaces">Enlaces</a>
      <a href="../inversiones">Inversiones</a>
      <a href="../sources">Sources</a>
      <a href="https://github.com/trabalonp/trabalonp.github.io" target="_blank">Github</a>
    </nav>
    <div class="auth-area">
      <button id="loginBtn"><i class="fab fa-google"></i> Login</button>
      <img id="userAvatar" alt="Avatar">
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <div class="bg-text">ACAD</div>

    <!-- Main Page (Subjects) -->
    <div id="main-page">
      <div class="section-header">
        <div class="section-num">05 — Archivos</div>
        <h1 class="section-title">Académicos <em>UPCT.</em></h1>
      </div>

      <div class="search-container">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Buscar asignatura...">
          <button onclick="filterSubjects()"><i class="fas fa-search"></i> Buscar</button>
        </div>
      </div>

      <div class="subjects-grid" id="subjectsGrid"></div>
    </div>

    <!-- Files Page (Folders & Files) -->
    <div id="files-page" class="files-container" style="display: none;">
      <div class="files-header">
        <button class="nav-btn" id="backToSubjectsBtn" onclick="showMainPage()" style="display: none;">
          <i class="fas fa-arrow-left"></i> Asignaturas
        </button>
        <h2 class="files-title" id="subject-title">Contenidos</h2>
        <button class="nav-btn" id="backToFoldersBtn" style="display: none;">
          <i class="fas fa-folder-open"></i> Carpetas
        </button>
      </div>

      <div class="folders-grid" id="foldersGrid"></div>

      <div class="search-container" id="fileSearchContainer" style="display: none; margin-top: 3rem;">
        <div class="search-box">
          <input type="text" id="fileSearchInput" placeholder="Buscar archivo...">
          <button onclick="filterFiles()"><i class="fas fa-search"></i> Buscar</button>
        </div>
      </div>

      <div class="files-grid" id="filesGrid" style="display: none; margin-top: 2rem;"></div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <span>© 2025 ONELIFE</span>
    <span>Hecho con dedicación.</span>
  </footer>

  <!-- PDF VIEWER -->
  <div class="pdf-viewer-container" id="pdfViewerContainer">
    <div class="pdf-header">
      <button class="pdf-back-btn" onclick="hidePDF()">
        <i class="fas fa-arrow-left"></i> Volver
      </button>
      <div class="pdf-title" id="pdfTitle">Documento</div>
    </div>
    <div class="pdf-frame-container">
      <iframe id="pdfViewer" class="pdf-viewer" src="" allow="autoplay"></iframe>
    </div>
  </div>

  <!-- MODERN SIDEBAR PROFILE -->
  <div id="overlay"></div>
  <div id="sidebar">
    <div class="sb-header">
      <span class="sb-title">Tu Perfil</span>
      <button class="sb-close" id="sbClose"><i class="fas fa-times"></i></button>
    </div>
    <div class="sb-body">
      <div class="profile-block">
        <div class="avatar-wrapper">
          <img id="sidebarAvatar" src="" alt="Avatar">
          <button id="editAvatarBtn" title="Cambiar foto"><i class="fas fa-camera"></i></button>
        </div>
        <div class="profile-name" id="sbName">—</div>
        <div class="profile-email" id="sbEmail">—</div>
        <div id="avatarBar">
          <input type="url" id="avatarUrlInput" placeholder="Pega la URL de la imagen">
          <div class="avatar-actions">
            <button class="btn-av" id="applyAvatarBtn">Aplicar</button>
            <button class="btn-av" id="cancelAvatarBtn">Cancelar</button>
          </div>
        </div>
      </div>
      <div class="info-card">
        <div class="info-title">Detalles de la Cuenta</div>
        <div class="info-row"><i class="fab fa-google"></i><span>Acceso vía Google</span></div>
        <div class="info-row"><i class="fas fa-shield-alt"></i><span>Autenticación verificada</span></div>
        <div class="info-row"><i class="fas fa-database"></i><span>Datos sincronizados en Firebase</span></div>
      </div>
    </div>
    <div class="sb-footer">
      <button id="logoutBtn">Cerrar Sesión</button>
    </div>
  </div>

  <div id="toast"></div>

  <!-- FIREBASE SCRIPTS -->

    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

      apiKey:            "AIzaSyDCm1pFZLRXk34UIGU3UY0ltLkyHkElsIg",
      authDomain:        "onelife-cec55.firebaseapp.com",
      projectId:         "onelife-cec55",
      storageBucket:     "onelife-cec55.firebasestorage.app",

      loginBtn.style.display   = 'inline-flex';
      userAvatar.style.display = 'none';
    }
    authArea.classList.add('ready');

    function showToast(msg, isError = false) {
      toast.textContent = msg;
      toast.className   = 'show' + (isError ? ' error' : '');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => { toast.className = ''; }, 3000);
    }

    function openSidebar()  { sidebar.classList.add('open'); overlay.classList.add('open'); }
    function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); hideAvatarBar(); }

    userAvatar.addEventListener('click', openSidebar);
    sbClose.addEventListener('click', closeSidebar);
    overlay.addEventListener('click', closeSidebar);

    function showAvatarBar() { avatarBar.classList.add('visible'); avatarUrlInput.value = ''; avatarUrlInput.focus(); }
    function hideAvatarBar() { avatarBar.classList.remove('visible'); avatarUrlInput.value = ''; }

    editAvatarBtn.addEventListener('click', () => {
      avatarBar.classList.contains('visible') ? hideAvatarBar() : showAvatarBar();
    });
    cancelAvatarBtn.addEventListener('click', hideAvatarBar);

    avatarUrlInput.addEventListener('keydown', e => {
      if (e.key === 'Enter')  applyAvatarBtn.click();
      if (e.key === 'Escape') hideAvatarBar();
    });

    applyAvatarBtn.addEventListener('click', async () => {
      const user = auth.currentUser;
      if (!user) { showToast('Inicia sesión primero.', true); return; }
      const url = avatarUrlInput.value.trim();
      if (!url)  { showToast('Pega una URL de imagen válida.', true); return; }

      const testImg  = new Image();
      testImg.onload = async () => {
        try {
          await set(ref(db, 'users/' + user.uid + '/avatarUrl'), url);
          applyAvatarToUI(url);
          localStorage.setItem(CK_AVATAR, url);
          hideAvatarBar();
          showToast('✓ Foto de perfil actualizada');
        } catch (err) { showToast('Error al guardar: ' + err.message, true); }
      };
      testImg.onerror = () => showToast('La URL no es una imagen válida.', true);
      testImg.src = url;
    });

    function applyAvatarToUI(url) {
      if (!url) return;
      userAvatar.src = url; sidebarAvatar.src = url;
    }

    function saveCache(user, avatarUrl) {
      localStorage.setItem(CK_LOGGED, 'true');
      localStorage.setItem(CK_NAME,   user.displayName || '');
      localStorage.setItem(CK_EMAIL,  user.email       || '');
      if (avatarUrl) localStorage.setItem(CK_AVATAR, avatarUrl);
    }

    function clearCache() {
      localStorage.setItem(CK_LOGGED, 'false');
      localStorage.removeItem(CK_AVATAR);
      localStorage.removeItem(CK_NAME);
      localStorage.removeItem(CK_EMAIL);
    }

    async function loadProfile(user) {
      sidebarName.textContent  = user.displayName || 'Usuario';
      sidebarEmail.textContent = user.email || '';

      const cached  = localStorage.getItem(CK_AVATAR);
      const initial = cached || user.photoURL || '';
      applyAvatarToUI(initial);

      try {
        const snap     = await get(ref(db, 'users/' + user.uid));
        const dbAvatar = snap.exists() && snap.val().avatarUrl ? snap.val().avatarUrl : null;
        if (dbAvatar && dbAvatar !== initial) {
          applyAvatarToUI(dbAvatar);
          localStorage.setItem(CK_AVATAR, dbAvatar);
        }
        saveCache(user, dbAvatar || initial);
      } catch (err) {
        saveCache(user, initial);
        console.warn('DB no disponible:', err.message);
      }
    }

    loginBtn.addEventListener('click', async () => {
      try { await signInWithPopup(auth, provider); }
      catch (err) { showToast('Error al iniciar sesión.', true); console.error(err); }
    });

    logoutBtn.addEventListener('click', async () => {
      await signOut(auth);
      clearCache();
      closeSidebar();
      showToast('Sesión cerrada correctamente');
    });

    onAuthStateChanged(auth, async user => {
      if (user) {
        loginBtn.style.display   = 'none';
        userAvatar.style.display = 'block';
        await loadProfile(user);
      } else {
        loginBtn.style.display   = 'inline-flex';
        userAvatar.style.display = 'none';
        sidebarName.textContent  = '—';
        sidebarEmail.textContent = '—';
        sidebarAvatar.src        = '';
        userAvatar.src           = '';
        if (localStorage.getItem(CK_LOGGED) === 'true') clearCache();
        else localStorage.setItem(CK_LOGGED, 'false');
      }
    });
  </script>

    /* ===== Render Functions ===== */
    function attachCursorHover(el) {

      // No afecta al cursor del sistema
    }

    function renderSubjects() {
      const grid = document.getElementById('subjectsGrid');
      grid.innerHTML = '';

      subjectsData.forEach(subject => {
        const totalFiles = subject.folders.reduce((count, folder) => count + folder.files.length, 0);
        const card = document.createElement('div');
        card.className = 'subject-card';
        card.innerHTML = `
          <div class="card-head">
            <div class="card-icon"><i class="${subject.icon}"></i></div>
            <span class="card-tag">ASIGNATURA</span>
          </div>
          <div>
            <h3 class="card-title">${subject.title}</h3>
            <p class="card-desc">${subject.description}</p>
          </div>
          <div class="card-footer">
            <span>${totalFiles} archivos / ${subject.folders.length} carpetas</span>
            <i class="fas fa-arrow-up-right-from-square"></i>
          </div>
        `;
        attachCursorHover(card);
        card.addEventListener('click', () => showFilesPage(subject.id));
        grid.appendChild(card);
      });
    }

    function filterSubjects() {
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      const grid = document.getElementById('subjectsGrid');
      const cards = grid.getElementsByClassName('subject-card');
      let found = false;

      for (let card of cards) {
        const title = card.querySelector('.card-title').textContent.toLowerCase();
        if (title.includes(searchTerm)) {
          card.style.display = '';
          found = true;
        } else {
          card.style.display = 'none';
        }
      }

      if (!found && searchTerm) {
        showToast('No se encontraron asignaturas.', true);
      }
    }

    function showFilesPage(subjectId) {
      const subject = subjectsData.find(s => s.id === subjectId);
      if (!subject) return;

      currentSubjectId = subjectId;
      currentSubjectFolders = subject.folders;
      currentFolderFiles = [];

      document.getElementById('main-page').style.display = 'none';

      const filesPage = document.getElementById('files-page');
      filesPage.style.display = 'block';
      filesPage.style.animation = 'fadeIn 0.4s ease';

      document.getElementById('backToSubjectsBtn').style.display = 'flex';
      document.getElementById('backToFoldersBtn').style.display = 'none';

      document.getElementById('subject-title').textContent = subject.title;

      document.getElementById('fileSearchContainer').style.display = 'none';
      document.getElementById('filesGrid').style.display = 'none';
      document.getElementById('filesGrid').innerHTML = '';

      renderFolders(currentSubjectFolders);
    }

    function renderFolders(foldersToRender) {
      const grid = document.getElementById('foldersGrid');
      grid.innerHTML = '';
      grid.style.display = 'grid';

      if (foldersToRender.length === 0) {
        grid.innerHTML = '<p style="color: var(--muted); font-family: var(--mono);">No se encontraron carpetas.</p>';
        return;
      }

      foldersToRender.forEach(folder => {
        const card = document.createElement('div');
        card.className = 'folder-card';
        card.innerHTML = `
          <div class="card-head">
            <div class="card-icon"><i class="${folder.icon}"></i></div>
            <span class="card-tag">CARPETA</span>
          </div>
          <div>
            <h3 class="card-title">${folder.name}</h3>
          </div>
          <div class="card-footer">
            <span>${folder.files.length} archivos</span>
            <i class="fas fa-arrow-right"></i>
          </div>
        `;
        attachCursorHover(card);
        card.addEventListener('click', () => showFolderContents(folder));
        grid.appendChild(card);
      });
    }

    function showFolderContents(folder) {
      currentFolderFiles = folder.files;

      document.getElementById('foldersGrid').style.display = 'none';
      document.getElementById('fileSearchContainer').style.display = 'block';
      document.getElementById('filesGrid').style.display = 'grid';
      document.getElementById('fileSearchInput').value = '';

      document.getElementById('backToFoldersBtn').style.display = 'flex';
      document.getElementById('backToSubjectsBtn').style.display = 'flex';

      const subjectTitle = subjectsData.find(s => s.id === currentSubjectId).title;
      document.getElementById('subject-title').textContent = `${folder.name} (${subjectTitle})`;

      renderFiles(currentFolderFiles);
    }

    function renderFiles(filesToRender) {
      const grid = document.getElementById('filesGrid');
      grid.innerHTML = '';

      if (filesToRender.length === 0) {
        grid.innerHTML = '<p style="color: var(--muted); font-family: var(--mono);">No hay archivos disponibles.</p>';
        return;
      }

      filesToRender.forEach(file => {
        const card = document.createElement('div');
        card.className = 'file-card';
        card.innerHTML = `
          <div class="card-head">
            <div class="card-title" style="font-size: 1.4rem;">${file.name}</div>
            <button class="view-btn ${file.available ? '' : 'disabled'}" title="${file.available ? 'Ver PDF' : 'No disponible'}">
              <i class="fas ${file.available ? 'fa-eye' : 'fa-lock'}"></i>
            </button>
          </div>
          <div class="card-desc">${file.description || 'Sin descripción.'}</div>
          <div class="card-footer">
            <span><i class="far fa-calendar"></i> ${file.date}</span>
            <span><i class="fas fa-weight-hanging"></i> ${file.size}</span>
          </div>
        `;
        attachCursorHover(card);

        if (file.available) {
          card.querySelector('.view-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            showPDF(file.driveId, file.name);
          });
          attachCursorHover(card.querySelector('.view-btn'));
        }

        grid.appendChild(card);
      });
    }

    function filterFiles() {
      const searchTerm = document.getElementById('fileSearchInput').value.toLowerCase();
      const filtered = currentFolderFiles.filter(file =>
        file.name.toLowerCase().includes(searchTerm)
      );
      renderFiles(filtered);
    }

    function showPDF(driveId, fileName) {
      const container = document.getElementById('pdfViewerContainer');
      const viewer = document.getElementById('pdfViewer');
      const title = document.getElementById('pdfTitle');

      title.textContent = fileName;
      viewer.src = `https://drive.google.com/file/d/${driveId}/preview`;
      container.style.display = 'flex';
    }

    function hidePDF() {
      document.getElementById('pdfViewerContainer').style.display = 'none';
      document.getElementById('pdfViewer').src = '';
    }

    function showMainPage() {
      document.getElementById('files-page').style.display = 'none';
      document.getElementById('main-page').style.display = 'block';
      document.getElementById('main-page').style.animation = 'fadeIn 0.4s ease';
      document.getElementById('backToSubjectsBtn').style.display = 'none';
      document.getElementById('backToFoldersBtn').style.display = 'none';
      currentSubjectId = null;
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'show' + (isError ? ' error' : '');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => { toast.className = ''; }, 3000);
    }
  </script>
